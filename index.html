<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>Đồng Hồ Thời Gian Thực — Giờ Phút Giây & Ngày Tháng Năm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #070913;
      --bg-secondary: #0f172a;
      --card-bg: rgba(15, 23, 42, 0.65);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-hour: #38bdf8;
      --accent-min: #a855f7;
      --accent-sec: #f43f5e;
      --orb-1: rgba(56, 189, 248, 0.22);
      --orb-2: rgba(168, 85, 247, 0.20);
      --orb-3: rgba(244, 63, 94, 0.15);
      --shadow-color: rgba(0, 0, 0, 0.55);
      --dial-bg: rgba(9, 13, 26, 0.85);
      --tick-color: rgba(255, 255, 255, 0.26);
      --tick-major: #f8fafc;
    }

    [data-theme="gold"] {
      --bg-primary: #0a0908;
      --bg-secondary: #171412;
      --card-bg: rgba(24, 21, 18, 0.72);
      --card-border: rgba(212, 175, 55, 0.24);
      --text-main: #fef9ee;
      --text-muted: #bda882;
      --accent-hour: #f59e0b;
      --accent-min: #fbbf24;
      --accent-sec: #ef4444;
      --orb-1: rgba(245, 158, 11, 0.20);
      --orb-2: rgba(217, 119, 6, 0.16);
      --orb-3: rgba(239, 68, 68, 0.12);
      --dial-bg: rgba(15, 13, 10, 0.9);
      --tick-color: rgba(251, 191, 36, 0.28);
      --tick-major: #fde68a;
    }

    [data-theme="emerald"] {
      --bg-primary: #04100d;
      --bg-secondary: #06211a;
      --card-bg: rgba(6, 33, 26, 0.65);
      --card-border: rgba(52, 211, 153, 0.2);
      --text-main: #ecfdf5;
      --text-muted: #6ee7b7;
      --accent-hour: #10b981;
      --accent-min: #06b6d4;
      --accent-sec: #facc15;
      --orb-1: rgba(16, 185, 129, 0.22);
      --orb-2: rgba(6, 182, 212, 0.18);
      --orb-3: rgba(250, 204, 21, 0.12);
      --dial-bg: rgba(4, 20, 16, 0.88);
      --tick-color: rgba(110, 231, 183, 0.26);
      --tick-major: #d1fae5;
    }

    [data-theme="light"] {
      --bg-primary: #f1f5f9;
      --bg-secondary: #e2e8f0;
      --card-bg: rgba(255, 255, 255, 0.82);
      --card-border: rgba(15, 23, 42, 0.1);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-hour: #2563eb;
      --accent-min: #7c3aed;
      --accent-sec: #e11d48;
      --orb-1: rgba(37, 99, 235, 0.15);
      --orb-2: rgba(124, 58, 237, 0.12);
      --orb-3: rgba(225, 29, 72, 0.10);
      --shadow-color: rgba(15, 23, 42, 0.12);
      --dial-bg: rgba(255, 255, 255, 0.94);
      --tick-color: rgba(15, 23, 42, 0.24);
      --tick-major: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      max-width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    body {
      font-family: 'Outfit', 'Inter', sans-serif;
      background-color: var(--bg-primary);
      background-image:
        radial-gradient(circle at 12% 18%, var(--orb-1) 0%, transparent 45%),
        radial-gradient(circle at 88% 82%, var(--orb-2) 0%, transparent 45%),
        radial-gradient(circle at 50% 45%, var(--orb-3) 0%, transparent 50%),
        radial-gradient(circle at 50% 0%, var(--bg-secondary), var(--bg-primary) 75%);
      background-attachment: fixed;
      color: var(--text-main);
      display: grid;
      place-items: center;
      padding: max(14px, env(safe-area-inset-top))
               max(14px, env(safe-area-inset-right))
               max(14px, env(safe-area-inset-bottom))
               max(14px, env(safe-area-inset-left));
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* Main Glass Card */
    .clock-dashboard {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      padding: 32px 36px;
      box-shadow: 0 25px 60px -15px var(--shadow-color),
                  inset 0 1px 1px rgba(255, 255, 255, 0.14);
      display: flex;
      flex-direction: column;
      gap: 26px;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--card-border);
    }

    .greeting-box {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .status-dot {
      flex-shrink: 0;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-sec);
      box-shadow: 0 0 12px var(--accent-sec);
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    .greeting-text {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-control {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s ease;
      white-space: nowrap;
    }

    .btn-control:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .btn-control.active {
      background: var(--accent-hour);
      color: #070913;
      border-color: transparent;
      font-weight: 600;
    }

    .theme-swatches {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.04);
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid var(--card-border);
    }

    .swatch {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .swatch.active {
      border-color: var(--text-main);
    }

    .swatch-aurora  { background: linear-gradient(135deg, #38bdf8, #a855f7); }
    .swatch-gold    { background: linear-gradient(135deg, #f59e0b, #78350f); }
    .swatch-emerald { background: linear-gradient(135deg, #10b981, #06b6d4); }
    .swatch-light   { background: linear-gradient(135deg, #f8fafc, #94a3b8); }

    /* Center Content Grid */
    .main-grid {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 32px;
      align-items: center;
    }

    /* Left: Pure SVG Analog Watch (NO CSS or SVG transforms used anywhere) */
    .analog-wrapper {
      width: 100%;
      max-width: 300px;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
    }

    .analog-face {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--dial-bg);
      box-shadow:
        inset 0 0 30px rgba(0, 0, 0, 0.55),
        0 14px 34px -10px var(--shadow-color),
        0 0 0 1px var(--card-border);
      overflow: hidden;
    }

    .analog-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .ring-bg {
      fill: none;
      stroke: var(--card-border);
      stroke-width: 4;
    }

    .ring-meter {
      fill: none;
      stroke-width: 4.5;
      stroke-linecap: round;
    }

    .ring-sec  { stroke: var(--accent-sec); }
    .ring-min  { stroke: var(--accent-min); }
    .ring-hour { stroke: var(--accent-hour); }

    .svg-tick {
      stroke: var(--tick-color);
      stroke-width: 2;
      stroke-linecap: round;
    }

    .svg-tick.major {
      stroke: var(--tick-major);
      stroke-width: 3;
    }

    .svg-brand-title {
      fill: var(--text-muted);
      font-family: 'Outfit', sans-serif;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 3.5px;
      text-anchor: middle;
    }

    .svg-brand-sub {
      fill: var(--text-muted);
      font-family: 'Outfit', sans-serif;
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 2.5px;
      opacity: 0.7;
      text-anchor: middle;
    }

    .svg-hand {
      stroke-linecap: round;
    }

    .svg-hand-hour {
      stroke: var(--accent-hour);
      stroke-width: 7;
    }

    .svg-hand-min {
      stroke: var(--accent-min);
      stroke-width: 5;
    }

    .svg-hand-sec {
      stroke: var(--accent-sec);
      stroke-width: 2.5;
    }

    .svg-center-outer {
      fill: var(--text-main);
      stroke: var(--accent-sec);
      stroke-width: 3;
    }

    /* Right: Digital & Date Section */
    .digital-section {
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-width: 0;
    }

    .date-banner {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .weekday-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      align-self: flex-start;
      padding: 5px 14px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(56, 189, 248, 0.16), rgba(168, 85, 247, 0.16));
      border: 1px solid var(--card-border);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent-hour);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .full-date-display {
      font-size: clamp(1.3rem, 2.6vw, 2.15rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--text-main);
    }

    /* Digital Time Cards (Giờ - Phút - Giây) */
    .time-cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .time-unit-card {
      position: relative;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 18px 10px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      min-width: 0;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .time-unit-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 20%;
      right: 20%;
      height: 3px;
      border-radius: 0 0 8px 8px;
    }

    .card-hour::before { background: var(--accent-hour); }
    .card-min::before  { background: var(--accent-min); }
    .card-sec::before  { background: var(--accent-sec); }

    .time-digits {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(1.9rem, 4.2vw, 3.6rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      color: var(--text-main);
    }

    .unit-label {
      margin-top: 6px;
      font-size: 0.74rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-muted);
    }

    .ampm-tag {
      position: absolute;
      top: 8px;
      right: 10px;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-hour);
    }

    /* Date Breakdown Boxes (Ngày - Tháng - Năm - Tuần) */
    .date-cards-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .date-pill {
      background: rgba(255, 255, 255, 0.028);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 3px;
      min-width: 0;
    }

    .date-pill-label {
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      font-weight: 600;
    }

    .date-pill-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(0.95rem, 1.9vw, 1.2rem);
      font-weight: 700;
      color: var(--text-main);
    }

    /* Day Progress Footer */
    .day-progress-bar {
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding-top: 12px;
      border-top: 1px solid var(--card-border);
    }

    .day-progress-header {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent-hour), var(--accent-min), var(--accent-sec));
    }

    /* =====================================================
       PORTRAIT TABLET & MOBILE (Màn hình dọc)
       ===================================================== */
    @media (max-width: 820px) and (orientation: portrait) {
      .clock-dashboard {
        padding: 22px 16px;
        gap: 20px;
        border-radius: 24px;
      }
      .top-bar {
        justify-content: center;
        text-align: center;
      }
      .greeting-box {
        width: 100%;
        justify-content: center;
      }
      .controls {
        width: 100%;
        justify-content: center;
      }
      .main-grid {
        grid-template-columns: 1fr;
        gap: 22px;
      }
      .analog-wrapper {
        max-width: 240px;
      }
      .date-banner {
        align-items: center;
        text-align: center;
      }
      .weekday-badge {
        align-self: center;
      }
    }

    @media (max-width: 480px) and (orientation: portrait) {
      .date-cards-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .time-cards {
        gap: 8px;
      }
      .time-unit-card {
        padding: 14px 6px 12px;
        border-radius: 16px;
      }
      .analog-wrapper {
        max-width: 210px;
      }
    }

    /* =====================================================
       LANDSCAPE MOBILE & COMPACT SCREENS (Điện thoại xoay ngang)
       Bắt mọi độ phân giải ngang trên điện thoại (kể cả khi zoom/desktop mode)
       ===================================================== */
    @media (orientation: landscape) and (max-height: 700px),
           (orientation: landscape) and (max-width: 1024px) {
      body {
        padding: max(8px, env(safe-area-inset-top))
                 max(12px, env(safe-area-inset-right))
                 max(8px, env(safe-area-inset-bottom))
                 max(12px, env(safe-area-inset-left));
      }
      .clock-dashboard {
        width: 100%;
        max-width: 920px;
        padding: 14px 20px;
        gap: 12px;
        border-radius: 22px;
      }
      .top-bar {
        padding-bottom: 8px;
        gap: 8px;
      }
      .greeting-text {
        font-size: 0.82rem;
      }
      .btn-control {
        padding: 4px 10px;
        font-size: 0.74rem;
      }
      .swatch {
        width: 15px;
        height: 15px;
      }
      .main-grid {
        grid-template-columns: clamp(145px, 38vh, 210px) minmax(0, 1fr);
        gap: 20px;
        align-items: center;
      }
      .analog-wrapper {
        max-width: 100%;
      }
      .digital-section {
        gap: 10px;
      }
      .date-banner {
        flex-direction: row;
        align-items: center;
        justify-content: flex-start;
        flex-wrap: wrap;
        gap: 10px;
      }
      .weekday-badge {
        padding: 3px 10px;
        font-size: 0.72rem;
      }
      .full-date-display {
        font-size: clamp(1.05rem, 2.2vw, 1.4rem);
      }
      .time-cards {
        gap: 10px;
      }
      .time-unit-card {
        padding: 10px 8px 8px;
        border-radius: 16px;
      }
      .time-digits {
        font-size: clamp(1.55rem, 3.6vw, 2.35rem);
      }
      .unit-label {
        margin-top: 2px;
        font-size: 0.64rem;
      }
      .date-cards-grid {
        gap: 8px;
      }
      .date-pill {
        padding: 6px 6px;
        border-radius: 12px;
        flex-direction: row;
        justify-content: center;
        gap: 6px;
      }
      .date-pill-label {
        font-size: 0.62rem;
      }
      .date-pill-value {
        font-size: 0.88rem;
      }
      .day-progress-bar {
        padding-top: 6px;
        gap: 4px;
      }
      .day-progress-header {
        font-size: 0.72rem;
      }
      .progress-track {
        height: 5px;
      }
    }
  </style>
</head>
<body data-theme="aurora">

  <main class="clock-dashboard">
    <!-- Top Header & Controls -->
    <header class="top-bar">
      <div class="greeting-box">
        <span class="status-dot"></span>
        <span class="greeting-text" id="greetingText">Chào buổi tối • Giờ chuẩn hệ thống</span>
      </div>

      <div class="controls">
        <div class="theme-swatches" title="Đổi giao diện màu sắc">
          <button class="swatch swatch-aurora active" data-set-theme="aurora" aria-label="Aurora"></button>
          <button class="swatch swatch-gold" data-set-theme="gold" aria-label="Royal Gold"></button>
          <button class="swatch swatch-emerald" data-set-theme="emerald" aria-label="Emerald"></button>
          <button class="swatch swatch-light" data-set-theme="light" aria-label="Minimal Light"></button>
        </div>

        <button class="btn-control active" id="btnFormat" title="Chuyển đổi định dạng 12h / 24h">
          <span>24H</span>
        </button>

        <button class="btn-control active" id="btnSweep" title="Chế độ kim giây trôi mượt hoặc nhảy từng nhịp">
          <span id="sweepLabel">Kim trôi</span>
        </button>

        <button class="btn-control" id="btnFullscreen" title="Toàn màn hình">
          <span>⛶ Toàn màn hình</span>
        </button>
      </div>
    </header>

    <!-- Main Clock Grid -->
    <section class="main-grid">
      <!-- Pure SVG Analog Clock: ZERO CSS/SVG transforms, 100% trigonometric coordinates -->
      <div class="analog-wrapper">
        <div class="analog-face">
          <svg class="analog-svg" viewBox="0 0 340 340">
            <!-- Outer Ring: Seconds (R=160, starts at 12 o'clock (170,10)) -->
            <circle class="ring-bg" cx="170" cy="170" r="160"></circle>
            <path class="ring-meter ring-sec" id="ringSec" d="M 170 10 A 160 160 0 1 1 170 330 A 160 160 0 1 1 170 10"></path>

            <!-- Middle Ring: Minutes (R=150, starts at 12 o'clock (170,20)) -->
            <circle class="ring-bg" cx="170" cy="170" r="150"></circle>
            <path class="ring-meter ring-min" id="ringMin" d="M 170 20 A 150 150 0 1 1 170 320 A 150 150 0 1 1 170 20"></path>

            <!-- Inner Ring: Hours (R=140, starts at 12 o'clock (170,30)) -->
            <circle class="ring-bg" cx="170" cy="170" r="140"></circle>
            <path class="ring-meter ring-hour" id="ringHour" d="M 170 30 A 140 140 0 1 1 170 310 A 140 140 0 1 1 170 30"></path>

            <!-- 60 Ticks generated via JS using exact (x1, y1, x2, y2) -->
            <g id="svgTicksGroup"></g>

            <!-- Brand Label -->
            <text x="170" y="114" class="svg-brand-title">CHRONO</text>
            <text x="170" y="126" class="svg-brand-sub">VIETNAM</text>

            <!-- Clock Hands positioned via exact (x1, y1, x2, y2) around (170, 170) -->
            <line id="handHour" class="svg-hand svg-hand-hour" x1="170" y1="170" x2="170" y2="98"></line>
            <line id="handMin"  class="svg-hand svg-hand-min"  x1="170" y1="170" x2="170" y2="70"></line>
            <line id="handSec"  class="svg-hand svg-hand-sec"  x1="170" y1="194" x2="170" y2="54"></line>

            <!-- Center Cap -->
            <circle cx="170" cy="170" r="7" class="svg-center-outer"></circle>
          </svg>
        </div>
      </div>

      <!-- Digital Clock & Full Date -->
      <div class="digital-section">
        <div class="date-banner">
          <div class="weekday-badge" id="weekdayBadge">THỨ HAI</div>
          <h1 class="full-date-display" id="fullDateDisplay">Ngày 26 Tháng 10 Năm 2026</h1>
        </div>

        <!-- Hours / Minutes / Seconds Cards -->
        <div class="time-cards">
          <div class="time-unit-card card-hour">
            <span class="ampm-tag" id="ampmTag" style="display: none;">SA</span>
            <div class="time-digits" id="digitHour">22</div>
            <span class="unit-label">Giờ</span>
          </div>

          <div class="time-unit-card card-min">
            <div class="time-digits" id="digitMin">07</div>
            <span class="unit-label">Phút</span>
          </div>

          <div class="time-unit-card card-sec">
            <div class="time-digits" id="digitSec">46</div>
            <span class="unit-label">Giây</span>
          </div>
        </div>

        <!-- Detailed Day / Month / Year / Week Cards -->
        <div class="date-cards-grid">
          <div class="date-pill">
            <span class="date-pill-label">Ngày</span>
            <span class="date-pill-value" id="pillDay">26</span>
          </div>
          <div class="date-pill">
            <span class="date-pill-label">Tháng</span>
            <span class="date-pill-value" id="pillMonth">10</span>
          </div>
          <div class="date-pill">
            <span class="date-pill-label">Năm</span>
            <span class="date-pill-value" id="pillYear">2026</span>
          </div>
          <div class="date-pill">
            <span class="date-pill-label">Tuần</span>
            <span class="date-pill-value" id="pillWeek">T44</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Footer Progress of Current Day -->
    <footer class="day-progress-bar">
      <div class="day-progress-header">
        <span id="dayOfYearText">Ngày thứ 299 trong năm</span>
        <span id="dayProgressPercent">Tiến trình ngày hôm nay: 92.2%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="dayProgressFill"></div>
      </div>
    </footer>
  </main>

  <script>
    const CX = 170;
    const CY = 170;
    const DEG_TO_RAD = Math.PI / 180;

    // Generate 60 SVG dial ticks using direct trigonometry (no transform attribute)
    const svgTicksGroup = document.getElementById('svgTicksGroup');
    const SVG_NS = 'http://www.w3.org/2000/svg';
    for (let i = 0; i < 60; i++) {
      const line = document.createElementNS(SVG_NS, 'line');
      const isMajor = i % 5 === 0;
      const angleRad = (i * 6 - 90) * DEG_TO_RAD;
      const cos = Math.cos(angleRad);
      const sin = Math.sin(angleRad);
      const rOuter = 130;
      const rInner = isMajor ? 117 : 123;

      line.setAttribute('class', isMajor ? 'svg-tick major' : 'svg-tick');
      line.setAttribute('x1', (CX + cos * rOuter).toFixed(2));
      line.setAttribute('y1', (CY + sin * rOuter).toFixed(2));
      line.setAttribute('x2', (CX + cos * rInner).toFixed(2));
      line.setAttribute('y2', (CY + sin * rInner).toFixed(2));
      svgTicksGroup.appendChild(line);
    }

    function setHandLine(lineEl, angleDeg, tipRadius, tailRadius) {
      const rad = (angleDeg - 90) * DEG_TO_RAD;
      const cos = Math.cos(rad);
      const sin = Math.sin(rad);
      lineEl.setAttribute('x1', (CX - cos * tailRadius).toFixed(2));
      lineEl.setAttribute('y1', (CY - sin * tailRadius).toFixed(2));
      lineEl.setAttribute('x2', (CX + cos * tipRadius).toFixed(2));
      lineEl.setAttribute('y2', (CY + sin * tipRadius).toFixed(2));
    }

    // State
    let is24Hour = true;
    let isSmoothSweep = true;
    let lastSecond = -1;

    // Elements
    const handHour = document.getElementById('handHour');
    const handMin  = document.getElementById('handMin');
    const handSec  = document.getElementById('handSec');

    const ringSec  = document.getElementById('ringSec');
    const ringMin  = document.getElementById('ringMin');
    const ringHour = document.getElementById('ringHour');

    const digitHour = document.getElementById('digitHour');
    const digitMin  = document.getElementById('digitMin');
    const digitSec  = document.getElementById('digitSec');
    const ampmTag   = document.getElementById('ampmTag');

    const weekdayBadge       = document.getElementById('weekdayBadge');
    const fullDateDisplay    = document.getElementById('fullDateDisplay');
    const greetingText       = document.getElementById('greetingText');
    const pillDay            = document.getElementById('pillDay');
    const pillMonth          = document.getElementById('pillMonth');
    const pillYear           = document.getElementById('pillYear');
    const pillWeek           = document.getElementById('pillWeek');
    const dayOfYearText      = document.getElementById('dayOfYearText');
    const dayProgressPercent = document.getElementById('dayProgressPercent');
    const dayProgressFill    = document.getElementById('dayProgressFill');

    // Setup SVG ring circumferences
    const CIRC_SEC  = 2 * Math.PI * 160;
    const CIRC_MIN  = 2 * Math.PI * 150;
    const CIRC_HOUR = 2 * Math.PI * 140;

    ringSec.style.strokeDasharray  = CIRC_SEC;
    ringMin.style.strokeDasharray  = CIRC_MIN;
    ringHour.style.strokeDasharray = CIRC_HOUR;

    const WEEKDAYS_VI = [
      'Chủ Nhật',
      'Thứ Hai',
      'Thứ Ba',
      'Thứ Tư',
      'Thứ Năm',
      'Thứ Sáu',
      'Thứ Bảy'
    ];

    function padZero(num) {
      return String(num).padStart(2, '0');
    }

    function getDayOfYear(date) {
      const start = new Date(date.getFullYear(), 0, 0);
      const diff = date - start + ((start.getTimezoneOffset() - date.getTimezoneOffset()) * 60 * 1000);
      return Math.floor(diff / (1000 * 60 * 60 * 24));
    }

    function getISOWeek(date) {
      const temp = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = temp.getUTCDay() || 7;
      temp.setUTCDate(temp.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(temp.getUTCFullYear(), 0, 1));
      return Math.ceil((((temp - yearStart) / 86400000) + 1) / 7);
    }

    function getGreeting(hours) {
      if (hours >= 5 && hours < 11) return 'Chào buổi sáng năng lượng ☀️';
      if (hours >= 11 && hours < 14) return 'Chào buổi trưa thư thái 🌤️';
      if (hours >= 14 && hours < 18) return 'Chào buổi chiều hiệu quả 🌇';
      if (hours >= 18 && hours < 22) return 'Chào buổi tối ấm áp 🌙';
      return 'Đêm khuya tĩnh lặng ✨';
    }

    function updateClock() {
      const now = new Date();
      const ms = now.getMilliseconds();
      const seconds = now.getSeconds();
      const minutes = now.getMinutes();
      const hours = now.getHours();

      const exactSeconds = isSmoothSweep ? seconds + ms / 1000 : seconds;
      const exactMinutes = minutes + exactSeconds / 60;
      const exactHours   = (hours % 12) + exactMinutes / 60;

      // Position Analog SVG Hands via exact trigonometric coordinates around (170, 170)
      setHandLine(handHour, exactHours * 30, 72, 0);
      setHandLine(handMin,  exactMinutes * 6, 100, 0);
      setHandLine(handSec,  exactSeconds * 6, 116, 24);

      // Update SVG Circular Progress Rings
      ringSec.style.strokeDashoffset  = CIRC_SEC * (1 - exactSeconds / 60);
      ringMin.style.strokeDashoffset  = CIRC_MIN * (1 - exactMinutes / 60);
      ringHour.style.strokeDashoffset = CIRC_HOUR * (1 - ((hours + exactMinutes / 60) / 24));

      // Update Digital Display once per second change
      if (seconds !== lastSecond) {
        lastSecond = seconds;

        let displayHour = hours;
        if (!is24Hour) {
          ampmTag.style.display = 'inline-block';
          ampmTag.textContent = hours >= 12 ? 'CH' : 'SA';
          displayHour = hours % 12 || 12;
        } else {
          ampmTag.style.display = 'none';
        }

        digitHour.textContent = padZero(displayHour);
        digitMin.textContent  = padZero(minutes);
        digitSec.textContent  = padZero(seconds);

        // Date & Greeting
        const day = now.getDate();
        const month = now.getMonth() + 1;
        const year = now.getFullYear();
        const weekday = WEEKDAYS_VI[now.getDay()];

        weekdayBadge.textContent = `📅 ${weekday}`;
        fullDateDisplay.textContent = `Ngày ${padZero(day)} Tháng ${padZero(month)} Năm ${year}`;

        pillDay.textContent   = padZero(day);
        pillMonth.textContent = padZero(month);
        pillYear.textContent  = year;
        pillWeek.textContent  = `T${padZero(getISOWeek(now))}`;

        const tzName = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Giờ địa phương';
        greetingText.textContent = `${getGreeting(hours)} • ${tzName}`;

        // Day Progress
        const totalDaySeconds = hours * 3600 + minutes * 60 + seconds;
        const percentDay = ((totalDaySeconds / 86400) * 100).toFixed(1);
        const dayOfYear = getDayOfYear(now);
        const isLeap = (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);

        dayOfYearText.textContent = `Ngày thứ ${dayOfYear}/${isLeap ? 366 : 365} trong năm ${year}`;
        dayProgressPercent.textContent = `Tiến trình ngày hôm nay: ${percentDay}%`;
        dayProgressFill.style.width = `${percentDay}%`;
      }

      requestAnimationFrame(updateClock);
    }

    // Controls Interactivity
    const btnFormat = document.getElementById('btnFormat');
    btnFormat.addEventListener('click', () => {
      is24Hour = !is24Hour;
      btnFormat.querySelector('span').textContent = is24Hour ? '24H' : '12H';
      btnFormat.classList.toggle('active', is24Hour);
      lastSecond = -1;
    });

    const btnSweep = document.getElementById('btnSweep');
    const sweepLabel = document.getElementById('sweepLabel');
    btnSweep.addEventListener('click', () => {
      isSmoothSweep = !isSmoothSweep;
      sweepLabel.textContent = isSmoothSweep ? 'Kim trôi' : 'Kim giật';
      btnSweep.classList.toggle('active', isSmoothSweep);
    });

    const btnFullscreen = document.getElementById('btnFullscreen');
    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // Theme Switcher
    const swatches = document.querySelectorAll('.swatch');
    swatches.forEach(swatch => {
      swatch.addEventListener('click', () => {
        swatches.forEach(s => s.classList.remove('active'));
        swatch.classList.add('active');
        document.body.setAttribute('data-theme', swatch.getAttribute('data-set-theme'));
      });
    });

    // Start animation loop
    requestAnimationFrame(updateClock);
  </script>
</body>
</html>
